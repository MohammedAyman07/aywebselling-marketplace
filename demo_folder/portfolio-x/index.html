<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio X | Demo</title>
    <style>
        body {
            font-family: 'Helvetica Neue', sans-serif;
            margin: 0;
            line-height: 1.6;
            color: #111;
            background-color: #fff;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .header {
            padding: 2rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -1px;
        }

        .nav a {
            color: #111;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.9rem;
        }

        .hero {
            padding: 6rem 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .hero p {
            font-size: 1.25rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 4rem 0;
        }

        .gallery-item {
            background: #f0f0f0;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #ccc;
            transition: all 0.3s;
        }

        .gallery-item:hover {
            background: #e0e0e0;
            color: #999;
        }

        .footer {
            padding: 4rem 0;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            border-top: 1px solid #eee;
        }

        /* Demo Bar */
        .demo-bar {
            background: #000;
            color: white;
            text-align: center;
            padding: 0.5rem;
            font-size: 0.9rem;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
        }

        body {
            padding-top: 40px;
        }
    </style>
</head>

<body>

    <div class="demo-bar">
        You are viewing a live demo. <a href="../../product.html"
            style="color: white; font-weight: bold; text-decoration: underline;">Buy this template</a>
    </div>

    <header class="header container">
        <div class="logo">Portfolio X</div>
        <nav class="nav">
            <a href="#">Work</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero container">
        <h1>I create digital experiences.</h1>
        <p>A minimal portfolio template for designers, developers, and creatives.</p>
    </section>

    <section class="gallery container">
        <div class="gallery-item">Project 1</div>
        <div class="gallery-item">Project 2</div>
        <div class="gallery-item">Project 3</div>
        <div class="gallery-item">Project 4</div>
        <div class="gallery-item">Project 5</div>
        <div class="gallery-item">Project 6</div>
    </section>

    <footer class="footer container">
        <p>&copy; 2026 Portfolio X. Created by aywebselling.</p>
    </footer>

</body>

</html>
